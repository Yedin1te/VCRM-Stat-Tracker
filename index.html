.pl{gap:8px}.pl>span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pl>.row{flex:none}

.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:4px 0}.cgrid.c2{grid-template-columns:repeat(2,1fr)}

.cc .cp{font-size:10px;color:var(--mu)}.cc .cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kk2{margin-right:3px;color:var(--ac)}
.cc.on{color:var(--tx);border-color:var(--ac)}
@media (min-width:1000px){html.lap .pr{grid-template-columns:210px 1fr}html.lap .pn{font-size:15px}}
.mg{border-top:1px solid var(--bd);padding:8px 0}.ms{padding:4px 0 4px 12px;font-size:14px;gap:8px}.mgn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmb{display:grid;grid-template-columns:1fr 1fr;gap:2px;height:12px;margin-top:6px}.pml,.pmr{background:var(--bg);display:flex;height:100%}.pml{justify-content:flex-end;border-radius:6px 0 0 6px;overflow:hidden}.pmr{border-radius:0 6px 6px 0;overflow:hidden}.pml span{background:var(--b)}.pmr span{background:var(--g)}
.md img{width:100%;border-radius:8px;border:1px solid var(--bd)}.dl{display:block;text-align:center;margin-top:8px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);text-decoration:none;font-weight:700}

.evd{margin-bottom:12px}.evd>summary{font-weight:700;padding:10px 4px;cursor:pointer}
</style>

<body>
<main id="app"></main>
<nav id="nav"></nav>

<script>
const K='vbtracker1';
let S={players:[],sets:[],cur:null},tab='game',sel=null,sub=false,fSet='all',D=null,cat='rec',arm=null,modal=false,fix=false,catInit=false,evOpen=false;
let RAW=null;try{RAW=localStorage.getItem(K)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const ID=/^[A-Za-z0-9][A-Za-z0-9_-]{0,39}$/,has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k),okid=v=>typeof v==='string'&&ID.test(v);
const cs=(v,n)=>typeof v==='string'?v.slice(0,n):typeof v==='number'&&isFinite(v)?String(v).slice(0,n):'';
const cday=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)?v:today();
const cint=(v,a,b,d)=>{v=Number(v);return Number.isInteger(v)&&v>=a&&v<=b?v:d};
const ROLES=[['MB','Mittelblocker'],['AA','Außenangreifer'],['DI','Diagonalangreifer'],['ZP','Zuspieler'],['LI','Libero']],cR=r=>ROLES.some(x=>x[0]===r)?r:'';
const roleOpts=v=>`<option value="">Rolle</option>`+ROLES.map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${l}</option>`).join('');
const cP=p=>p&&okid(p.id)?{id:p.id,name:cs(p.name,40),nr:cs(p.nr,3),role:cR(p.role)}:null;
const cG=g=>g&&okid(g.id)?{id:g.id,opp:cs(g.opp,40),date:cday(g.date)}:null;
const cA=a=>(Array.isArray(a)?a:[]).filter(okid).slice(0,20);
const cE=e=>e&&okid(e.id)&&(e.p===''||okid(e.p))&&typeof e.c==='string'&&has(CATS,e.c)&&typeof e.r==='string'&&CATS[e.c].b.some(x=>x[0]===e.r)?{id:e.id,p:e.p,c:e.c,r:e.r,rot:cint(e.rot,1,6,1),t:Number.isFinite(Number(e.t))?Number(e.t):0}:null;
const cPos=a=>Array.isArray(a)?a.slice(0,6).map(x=>x===''||okid(x)?x:''):[];
const cRl=o=>{const r={};if(o&&typeof o==='object'&&!Array.isArray(o))Object.keys(o).filter(okid).slice(0,20).forEach(k=>{r[k]=cR(o[k])});return r};
const cS=s=>s&&okid(s.id)&&(!s.gid||okid(s.gid))?{id:s.id,gid:s.gid||'',opp:cs(s.opp,40),date:cday(s.date),serve:s.serve==='Annahme'?'Annahme':'Aufschlag',rot:cint(s.rot,1,6,1),act:cA(s.act),pos:cPos(s.pos),rl:cRl(s.rl)}:null;
function cOp(o){
 if(!o||typeof o!=='object')return null;const k=o.k;
 if(k==='p+'){const p=cP(o.p);return p&&{k,p}}
 if(k==='p-'||k==='e-')return okid(o.id)?{k,id:o.id}:null;
 if(k==='g-'||k==='s-')return okid(o.id)?{k,id:o.id}:null;
 if(k==='p~')return okid(o.id)?{k,id:o.id,role:cR(o.role)}:null;
 if(k==='g+'){const g=cG(o.g);return g&&{k,g}}
 if(k==='s+'){const s=cS(o.s);return s&&okid(s.gid)?{k,s}:null}
 if(k==='s~')return okid(o.id)?{k,id:o.id,rot:cint(o.rot,1,6,1),act:cA(o.act),pos:o.pos===undefined?undefined:cPos(o.pos),rl:o.rl===undefined?undefined:cRl(o.rl)}:null;
 if(k==='e+'){const e=cE(o.e),x=o.x||{};return e&&okid(o.sid)?{k,sid:o.sid,e,x:{datum:cday(x.datum),gegner:cs(x.gegner,40),satz:cint(x.satz,1,99,1),spieler:cs(x.spieler,40),nr:cs(x.nr,3),bereich:cs(x.bereich,20),ergebnis:cs(x.ergebnis,20)}}:null}
 return null;
}
function cleanState(d){
 if(!d||typeof d!=='object')return null;
 const L=a=>Array.isArray(a)?a.slice(0,5000):[];
 const uniq=(a,f)=>{const seen=new Set(),o=[];L(a).forEach(x=>{const c=f(x);if(c&&!seen.has(c.id)){seen.add(c.id);o.push(c)}});return o};
 const out={players:uniq(d.players,cP),games:uniq(d.games,cG),sets:[],cur:null,pend:[]},seen=new Set();
 L(d.sets).forEach(s=>{const c=cS(s);if(c&&!seen.has(c.id)){seen.add(c.id);c.ev=uniq(s.ev,cE);out.sets.push(c)}});
 out.cur=typeof d.cur==='string'&&out.sets.some(s=>s.id===d.cur)?d.cur:null;
 out.pend=L(d.pend).map(cOp).filter(Boolean);
 return out;
}
const mig=()=>{S.games=S.games||[];S.pend=S.pend||[];S.sets.forEach(s=>{s.ev.forEach(e=>{if(!e.id)e.id=uid()});if(!s.gid){let g=S.games.find(g=>g.opp===s.opp&&g.date===s.date);if(!g){g={id:uid(),opp:s.opp,date:s.date};S.games.push(g)}s.gid=g.id}})};mig();
const gname=g=>`${g.date.split('-').reverse().join('.')} gegen ${esc(g.opp)}`;
const nrOf=s=>S.sets.filter(x=>x.gid===s.gid).indexOf(s)+1;
const lastAct=gid=>{const l=S.sets.filter(s=>s.gid===gid).pop();return l?l.act.slice():[]};
const CATS={
 rec:{n:'Annahme',b:[['err','Fehler','b'],['bad','Schlecht','w'],['ok','Gut','n'],['perf','Perfekt','g']]},
 att:{n:'Angriff',b:[['err','Fehler','b'],['rec','Ohne Wirkung','w'],['eff','Wirkung','n'],['pt','Punkt','g'],['blk','Block','g']]},
 srv:{n:'Aufschlag',b:[['err','Fehler','b'],['none','Ohne Wirkung','w'],['eff','Wirkung','n'],['ace','Ass','g']]},
 sc:{n:'Spielstand',b:[['opp','Punkt Gegner','b'],['oerr','Gegnerfehler','n'],['us','Punkt wir','g'],['wp','Korrektur wir +1','n'],['wm','Korrektur wir -1','n'],['gp','Korrektur Gegner +1','n'],['gm','Korrektur Gegner -1','n'],['sv','Aufschlag tauschen','n']]}};
try{const c=cleanState(JSON.parse(RAW));if(c)S=c}catch(e){}
mig();if(!S.players.length)tab='pl';
const pn=id=>{const p=S.players.find(p=>p.id===id);return p?`#${esc(p.nr)} ${esc(p.name)}`:'Gelöscht'};
const chips=(on,act)=>S.players.map(p=>`<button class="chip ${on(p)?'on':''}" data-act="${act}" data-v="${p.id}">#${esc(p.nr)} ${esc(p.name)}</button>`).join('');
const curSet=()=>S.sets.find(s=>s.id===S.cur);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',1500)}

function setup(){
 if(!D){const lg=S.games[S.games.length-1];D={gid:lg&&lg.date===today()?lg.id:'new',opp:'',date:today(),serve:'Aufschlag',rot:1,act:[],pos:[],rl:{}};if(D.gid!=='new'){D.act=lastAct(D.gid);D.pos=fixPos(D.act,lastPos(D.gid));D.serve=nextServe(D.gid);D.rl=lastRl(D.gid)}}
 const g=S.games.find(g=>g.id===D.gid),zp=zpPos(D.pos,D.rl);
 if(zp)D.rot=zp;
 if(!S.players.length)return `<div class="card"><h2>Neuer Satz</h2><p>Lege zuerst deine Mitspieler an.</p><button class="pri" data-act="tab" data-v="pl">Spieler anlegen</button></div>`;
 return `<div class="card"><h2>Neuer Satz</h2>
 <label>Spiel</label><select data-sel="gid"><option value="new">Neues Spiel</option>${S.games.slice().reverse().map(g=>`<option value="${g.id}" ${D.gid===g.id?'selected':''}>${gname(g)}</option>`).join('')}</select>
 ${g?`<div class="mu" style="margin-top:6px">Das wird Satz ${S.sets.filter(s=>s.gid===g.id).length+1} gegen ${esc(g.opp)}.</div><div class="row" style="margin-top:6px">${S.sets.filter(s=>s.gid===g.id).map(s=>`<button data-act="resume" data-v="${s.id}">Satz ${nrOf(s)} fortsetzen</button>`).join('')}</div>`:`<label>Gegner</label><input data-in="opp" value="${esc(D.opp)}" placeholder="Name des Gegners"><label>Datum</label><input type="date" data-in="date" value="${D.date}">`}
 <label>Wir starten mit${g&&S.sets.some(s=>s.gid===g.id)?' (wechselt jeden Satz)':''}</label><div class="row seg">${['Aufschlag','Annahme'].map(v=>`<button class="${D.serve===v?'on':''}" data-act="serve" data-v="${v}">${v}</button>`).join('')}</div>
 <label>Start-Läufer</label>${zp?`<div class="mu">Läufer <b>${zp}</b>, denn der Zuspieler steht auf Position ${zp}</div>`:`<div class="row seg">${[1,2,3,4,5,6].map(v=>`<button class="${D.rot===v?'on':''}" data-act="rot" data-v="${v}">${v}</button>`).join('')}</div><div class="mu" style="margin-top:4px">Tipp: Trage bei einem Spieler die Rolle Zuspieler ein, dann wird der Läufer automatisch bestimmt.</div>`}
 <label>Wer spielt?</label><div class="row">${chips(p=>D.act.includes(p.id),'tog')}</div>
 <label>Aufstellung (Position 1 schlägt auf)</label>${posGrid(D.pos,S.players.filter(p=>D.act.includes(p.id)),'pos')}
 <label>Rollen in diesem Satz (nur ändern, wenn abweichend)</label>${rolesGrid(S.players.filter(p=>D.act.includes(p.id)),D.rl,'rl')}
 <button class="pri" data-act="start">Satz starten</button></div>`;
}
function game(s){
 const cnt=(p,c,r)=>s.ev.filter(e=>e.p===p&&e.c===c&&e.r===r).length;
 const ro=p=>{const i=ROLES.findIndex(r=>r[0]===eRole(s,p));return i<0?9:i};
 const pp=padPos(s.pos),pi=id=>{const i=pp.indexOf(id);return i<0?9:i};
 const act=actSorted(s),KM=lapOn()?kbRev(s):{};
 const o=CATS[cat];
 const sc=replay(s),won=(Math.max(sc.u,sc.o)>=target(s))&&Math.abs(sc.u-sc.o)>=2;
 const sv=sc.srv==='us'?S.players.find(p=>p.id===pp[0]):null;
 let h=`<div class="gl"><div class="row top a-h"><div class="tt"><div class="score num" data-act="fix" style="cursor:pointer"><span class="${sc.srv==='us'?'sv':''}">${sc.u}</span> : <span class="${sc.srv==='opp'?'sv':''}">${sc.o}</span><span class="mu" style="font-size:12px;font-weight:400"> ✎</span></div><div class="mu sub">${esc(s.opp)} · Satz ${nrOf(s)} · Aufschlag ${sc.srv==='us'?'wir'+(sv?` (#${esc(sv.nr)} ${esc(sv.name)})`:''):'Gegner'}${won?` · <b style="color:var(--${sc.u>sc.o?'g':'b'})">Satz ${sc.u>sc.o?'gewonnen':'verloren'}, bitte beenden</b>`:''}</div></div>
 <button class="sm" data-act="rot+">Läufer <b class="num">${s.rot}</b> ▸</button>
 <button class="sm ${sub?'on':''}" data-act="wech">Wechsel</button></div>
 <div class="grid g2 a-p" style="margin-bottom:6px">${CATS.sc.b.filter(x=>x[0]==='opp'||x[0]==='oerr').map(([r,l,k])=>`<button class="hb ${k}" data-act="pt" data-v="${r}" style="min-height:38px;font-size:13px">${l}</button>`).join('')}</div>`;
 if(fix)h+=`<div class="card a-s" style="padding:8px"><div class="mu" style="margin-bottom:6px">Spielstand korrigieren (ändert nur den Stand, nicht die Statistik)</div><div class="grid g2">${[['wm','Wir −1'],['wp','Wir +1'],['gm','Gegner −1'],['gp','Gegner +1']].map(([r,l])=>`<button data-act="pt" data-v="${r}">${l}</button>`).join('')}</div><button data-act="pt" data-v="sv" style="width:100%;margin-top:6px">Aufschlag tauschen (jetzt: ${sc.srv==='us'?'wir':'Gegner'})</button></div>`;
 if(sub)h+=`<div class="card a-s" style="padding:8px"><div class="mu" style="margin-bottom:6px">Wechsel: Spieler auf eine Position setzen</div>${posGrid(pp,S.players,'wpos')}<div class="mu" style="margin:8px 0 4px">Zusätzlich anzeigen (z.B. Libero)</div><div class="row">${S.players.filter(p=>!pp.includes(p.id)).map(p=>`<button class="chip ${s.act.includes(p.id)?'on':''}" data-act="tga" data-v="${p.id}">#${esc(p.nr)} ${esc(p.name)}</button>`).join('')}</div><div class="mu" style="margin:8px 0 4px">Rollen in diesem Satz</div>${rolesGrid(S.players.filter(p=>s.act.includes(p.id)),s.rl,'wrl')}</div>`;
 h+=`<div class="row seg a-t" style="margin-bottom:6px">${Object.entries(CATS).filter(([c])=>c!=='sc').map(([c,x])=>`<button class="${cat===c?'on':''}" data-act="cat" data-v="${c}" style="padding:7px">${x.n}</button>`).join('')}</div>`;
 h+=lapOn()?kbHtml(s):'';
 h+=`<div class="a-r">`+(act.length?act.map((p,k)=>`<div class="pr${k&&eRole(s,act[k-1])!==eRole(s,p)?' gs':''}${pi(p.id)===0&&sc.srv==='us'?' srvr':''}${KB.sel===p.id?' kbsel':''}"><span class="pn">${KM[p.id]?`<kbd class="kk2">${KM[p.id].toUpperCase()}</kbd>`:''}<span class="pp">${pi(p.id)<9?pi(p.id)+1:'·'}</span>${eRole(s,p)?`<span class="rl ${eRole(s,p)}">${eRole(s,p)}</span>`:''} <b>#${esc(p.nr)}</b> ${esc(p.name)}</span><div class="grid ${o.b.length===5?'g5':o.b.length===4?'g4':'g3'}">${o.b.map(([r,l,k],bi)=>`<button class="hb ${k}" data-act="hit" data-v="${p.id}|${cat}|${r}"><span>${l}</span><b class="num">${cnt(p.id,cat,r)}</b>${lapOn()?`<kbd class="kk">${bi+1}</kbd>`:''}</button>`).join('')}</div></div>`).join(''):`<div class="card mu">Niemand auf dem Feld. Tippe auf Wechsel und wähle die Spieler.</div>`)+`</div>`;
 return h+`<div class="row a-u" style="margin-top:8px"><button data-act="undo" style="flex:1">Rückgängig</button><button data-act="end" style="flex:1" class="${arm==='end'?'on':''}">${arm==='end'?'Wirklich beenden?':'Satz beenden'}</button></div></div>`;
}
function players(){
 return `<div class="card"><h2>Spieler</h2>
 ${S.players.map((p,i)=>`<div class="pl"><span>${lapOn()&&i<PKEYS.length?`<kbd>${PKEYS[i].toUpperCase()}</kbd> `:''}#${esc(p.nr)} ${esc(p.name)}</span><span class="row" style="flex-wrap:nowrap"><select data-sel="prole" data-v="${p.id}" style="width:auto;padding:8px">${roleOpts(p.role)}</select><button data-act="delp" data-v="${p.id}" class="${arm===p.id?'on':''}">${arm===p.id?'Sicher?':'Löschen'}</button></span></div>`).join('')||'<p class="mu">Noch keine Spieler.</p>'}
 <label>Name</label><input id="pname" maxlength="40"><label>Rückennummer</label><input id="pnr" inputmode="numeric" maxlength="3"><label>Rolle</label><select id="prole0">${roleOpts('')}</select>
 <button class="pri" data-act="addp">Spieler hinzufügen</button></div>`;
}
function helpHtml(){
 const P=(k,x)=>`<span class="pill ${k}">${x}</span>`,D=(pill,txt)=>`<div class="hd">${pill}<div>${txt}</div></div>`;
 return `<div class="help">
 <details open><summary>Schnellstart: das ist zuerst zu tun</summary><ol>
 <li><b>Spieler anlegen</b> (Reiter „Spieler"): Name, Rückennummer und Rolle. Beim Zuspieler unbedingt die Rolle „Zuspieler" eintragen, daraus berechnet die App den Läufer.</li>
 <li><b>Optional Google Tabelle verbinden</b> (⚙ → Google Tabelle). Ohne Verbindung bleiben die Daten nur auf diesem Handy.</li>
 <li><b>Satz starten</b> (Reiter „Spiel"): Neues Spiel mit Gegner und Datum anlegen oder ein bestehendes Spiel wählen. Dann Aufschlag oder Annahme zum Start wählen, die Spieler auswählen und die Aufstellung (Position 1 bis 6) festlegen. Ab Satz 2 wechselt das Aufschlagrecht automatisch.</li>
 <li><b>Zählen:</b> Oben den Bereich wählen (Annahme, Angriff oder Aufschlag), dann beim Spieler das Ergebnis antippen. Die App springt nach den meisten Eingaben selbst zum nächsten Bereich.</li>
 <li><b>Satz beenden</b> (zweimal tippen). Bei 25 Punkten (im 5. Satz 15) mit 2 Punkten Vorsprung meldet die App das Satzende.</li></ol>
 <p class="mu">Wichtig: Einigt euch im Team vor dem Spiel, wer was wie bewertet. Die Auswertung ist nur vergleichbar, wenn alle gleich zählen. Die folgenden Beschreibungen sind ein Vorschlag.</p></details>
 <details><summary>Annahme: die vier Felder</summary>
 <p class="mu">Bewertet die erste Ballberührung nach dem gegnerischen Aufschlag danach, wie gut der Zuspieler danach arbeiten kann.</p>
 ${D(P('b','Fehler'),'Annahme direkt verloren: Ball im Aus, im Netz, auf dem Boden oder nicht spielbar. Punkt für den Gegner, wird automatisch gezählt. Note 0.')}
 ${D(P('w','Schlecht'),'Der Ball ist gespielt, aber das Zuspiel nur eine Notlösung: Zuspieler weit weg vom Ziel, keine echte Angriffsoption oder der Ball muss direkt zurück. Note 1.')}
 ${D(P('n','Gut'),'Zuspiel gut möglich, aber nicht genau: Der Zuspieler muss sich bewegen oder es gibt nur eingeschränkte Angriffsoptionen, zum Beispiel ohne Mitte. Note 2.')}
 ${D(P('g','Perfekt'),'Der Ball kommt genau zum Zuspieler, alle Angriffsoptionen sind möglich. Note 3.')}
 <p class="mu">„Positiv" in der Auswertung heißt Gut plus Perfekt. Das Ø ist die Durchschnittsnote von 0 bis 3.</p></details>
 <details><summary>Angriff: die fünf Felder</summary>
 ${D(P('b','Fehler'),'Ball im Netz, im Aus oder direkt geblockt. Punkt für den Gegner, wird automatisch gezählt.')}
 ${D(P('w','Ohne Wirkung'),'Der Gegner wehrt den Ball ab oder nimmt ihn problemlos auf, der Ballwechsel läuft normal weiter. Der Angriff hatte keine Wirkung.')}
 ${D(P('n','Wirkung'),'Der Angriff bringt den Gegner in Not: Er kann nur eine Notlösung oder einen Freeball spielen. Es ist aber noch kein direkter Punkt.')}
 ${D(P('g','Punkt'),'Direkter Punkt für uns durch den Angriff, wird automatisch gezählt.')}
 ${D(P('g','Block'),'Direkter Blockpunkt des Spielers, wird automatisch als Punkt für uns gezählt. In der Auswertung steht er getrennt von der Angriffsquote.')}</details>
 <details><summary>Aufschlag: die vier Felder</summary>
 ${D(P('b','Fehler'),'Netz, Aus oder Fußfehler. Punkt für den Gegner, wird automatisch gezählt.')}
 ${D(P('w','Ohne Wirkung'),'Der Gegner nimmt problemlos an und kann alle Angriffsoptionen nutzen.')}
 ${D(P('n','Wirkung'),'Der Gegner kann nur eingeschränkt annehmen (schlechte Annahme oder Notlösung), aber es ist noch kein direkter Punkt.')}
 ${D(P('g','Ass'),'Direkter Punkt für uns: Der Gegner kann den Ball nicht annehmen. Wird automatisch gezählt.')}</details>
 <details><summary>Punkte, Aufschlag und Läufer</summary>
 <p><b>Punkte entstehen automatisch</b> aus Angriff „Punkt" oder „Block" und Aufschlag „Ass" (Punkt für uns) und aus jedem „Fehler" bei Annahme, Angriff und Aufschlag (Punkt für den Gegner).</p>
 <p><b>Der Bereich springt von selbst:</b> Nach einer Annahme (außer Fehler) und nach einem Aufschlag ohne direkten Punkt oder Fehler wechselt die App zu „Angriff". Nach jedem Punkt springt sie zu „Aufschlag", wenn wir als Nächstes aufschlagen, sonst zu „Annahme".</p>
 <p>Oben gibt es zwei Tasten: <b>Punkt Gegner</b> (Punkt für den Gegner, der nicht aus einem eigenen Fehler kommt, zum Beispiel sein Angriffspunkt) und <b>Gegnerfehler</b> (ein Fehler des Gegners, der uns den Punkt bringt, zum Beispiel sein Aufschlag ins Aus). Eigene Punkte entstehen über Angriff „Punkt", Block oder Ass.</p>
 <p><b>Spielstand korrigieren:</b> Tippe auf den Spielstand oben. Dort kannst du jede Seite um 1 erhöhen oder senken und den Aufschlag tauschen. Das ändert nur den Stand, nicht die Statistik. „Rückgängig" nimmt auch eine Korrektur zurück. „Aufschlag tauschen" dreht den Läufer nicht, dafür nutzt du „Läufer" oben.</p>
 <p>Wer einen Punkt macht, schlägt als Nächstes auf. Gewinnen wir den Punkt bei gegnerischem Aufschlag, dreht die Mannschaft eine Position weiter. Daran erkennst du, wer aufschlägt: Oben steht „Aufschlag wir" mit Name, und die Zeile des Aufschlägers ist orange markiert.</p>
 <p><b>Läufer</b> ist die Position des Zuspielers. Die Reihenfolge ist 1 → 6 → 5 → 4 → 3 → 2 → 1. Position 1 ist hinten rechts und schlägt auf, vorne stehen 4, 3, 2 von links nach rechts, hinten 5, 6, 1. Beim Satzstart ergibt sich der Läufer aus der Position des Zuspielers. Hat kein Spieler in der Aufstellung die Rolle Zuspieler, wählst du den Läufer selbst.</p>
 <p>Mit „Läufer" oben drehst du von Hand weiter, falls etwas korrigiert werden muss. „Rückgängig" nimmt die letzte Eingabe zurück, auch Punkt und Drehung.</p></details>
 <details><summary>Wechsel und Spielerzeilen</summary>
 <p>Mit <b>Wechsel</b> setzt du einen Spieler auf eine Position. Der Ausgewechselte verschwindet aus der Liste. Unter „Zusätzlich anzeigen" kannst du zum Beispiel den Libero einblenden.</p>
 <p><b>Rollen flexibel:</b> Die Rolle beim Spieler ist nur die Standardrolle. Beim Satzstart und unter „Wechsel" kannst du die Rolle für diesen Satz ändern, zum Beispiel einen Außenangreifer als Diagonal oder Libero einsetzen. Sortierung, Farbe und der Läufer richten sich nach dieser Satz-Rolle.</p>
 <p>Die Zeilen sind nach Rolle gruppiert (MB Mittelblocker, AA Außenangreifer, DI Diagonalangreifer, ZP Zuspieler, LI Libero) und innerhalb einer Rolle nach Rückennummer sortiert. Die kleine Zahl vorn ist die aktuelle Position.</p></details>
 <details><summary>Auswertung lesen</summary>
 <p>Oben wählst du, ob alle Spiele, ein ganzes Spiel oder ein einzelner Satz gezeigt wird. Darunter siehst du das Auswertungsblatt im A4-Querformat: oben Gegner, Datum und Ergebnis, dann eine Tabelle mit der Anzahl je Bewertung (Annahme: Fehler, Schlecht, Gut, Perfekt; Angriff und Aufschlag: Fehler, ohne Wirkung, mit Wirkung, Punkt bzw. Ass, beim Angriff auch Block), dahinter Effizienz und Plus/Minus, ganz unten die Teamwerte Annahme-Verteilung, Angriffsverteilung und Sideout-Quote je Läufer. Die Zahlen gelten für die oben gewählte Auswahl (alle Spiele, ein Spiel oder ein Satz). Für einen einzelnen Satz wählst du ihn oben aus. Am Handy hilft das Querformat (⟳) oder seitliches Wischen. Die Karten „Punkte", „Plus/Minus" und die Einzelkarten stehen darunter im Bereich „Weitere Auswertungen".</p>
 <p><b>Teamwerte:</b> Die Annahme-Verteilung zeigt, wie viele Annahmen Fehler, Schlecht, Gut oder Perfekt waren (auch je Satz). Die Angriffsverteilung zeigt den Anteil der Angriffe je Spieler. Sideout-Quote: Anteil der Ballwechsel nach gegnerischem Aufschlag, die wir gewonnen haben, je Läufer (Position des Zuspielers). 1st Ball: Anteil dieser Ballwechsel, die wir direkt mit dem ersten Angriff nach der Annahme gewonnen haben (Angriff „Punkt“, ohne Block und ohne Gegnerfehler). Break: dasselbe wie Sideout nach eigenem Aufschlag. Grün ab 65 %, rot unter 50 %, erst ab 3 Ballwechseln. Es zählen nur Ballwechsel mit erfasstem Punkt.</p>
 <p><b>Annahme:</b> Ø-Note und Anteil positiver Annahmen. <b>Angriff:</b> Punktquote und Fehlerquote, dazu die Zahl der Blockpunkte (die Quoten rechnen ohne Block). <b>Aufschlag:</b> Fehlerquote und „Wirkung+Ass", also der Anteil der Aufschläge, die Druck gemacht haben.</p>
 <p><b>Plus/Minus:</b> Plus sind direkte Punkte (Angriff „Punkt", Block, Ass), Minus sind eigene Fehler (Annahme-, Angriffs- und Aufschlagfehler). Der Saldo ist Plus minus Minus, grün über 0 und rot darunter. In den Karten sind die Spieler nach Saldo sortiert, im Blatt nach Rückennummer.</p>
 <p><b>Effizienz:</b> Angriff = (Punkte − Fehler) ÷ Angriffe, ohne Blocks. Grün ab 25 %, rot unter 5 %. Aufschlag = (Asse − Fehler) ÷ Aufschläge. Grün ab 0 %, rot unter −15 %. Annahme = Ø-Note in Prozent von 3. Grün ab 73 %, rot unter 50 %. Alle Farben erscheinen erst ab 3 Aktionen.</p>
 <p><b>Als Bild teilen:</b> Der Knopf oben in der Auswertung erzeugt das Auswertungsblatt als Bild im Querformat (Ergebnis, Tabelle, Teamwerte) und öffnet das Teilen-Menü deines Geräts, zum Beispiel für WhatsApp. Geht das nicht, erscheint das Bild zum Speichern.</p>
 <p>Die Balken zeigen die Verteilung. Die Farbe der Kennzahlen: grün stark, gelb mittel, rot schwach. Sie erscheint erst ab 3 Aktionen. Grün sind zum Beispiel Annahme-Ø ab 2,2, Angriffs-Punktquote ab 35 % und Fehlerquoten bis 10 %.</p></details>
 <details><summary>Laptop-Modus: Erfassen mit der Tastatur</summary>
 <p>Auf einem Laptop ohne Touch schaltet sich der Tastatur-Modus von selbst ein (oder unter ⚙ → Laptop-Modus). Die Hände bleiben dabei auf der Tastatur: <b>links Bereich und Bewertung, rechts der Spieler.</b> Auf jedem Feld stehen die Zifferntasten klein in der Ecke, in jeder Spielerzeile die Spielertaste.</p>
 <p><b>1. Bereich</b> (nur nötig, wenn die App nicht schon von selbst im richtigen Bereich ist): ${Object.entries(CATKEYS).map(([k,c])=>`<kbd>${k.toUpperCase()}</kbd> ${CATS[c].n}`).join(' · ')}. Die Reihenfolge entspricht den Reitern von links nach rechts.</p>
 <p><b>2. Spieler:</b> Jeder Spieler hat immer dieselbe Taste, unabhängig von Position, Rotation und Rolle. Die Tasten laufen in der Reihenfolge der Spielerliste (Reiter „Spieler") über die rechte Seite der Tastatur: ${PKEYS.map(k=>`<kbd>${k.toUpperCase()}</kbd>`).join(' ')}. Ein neuer Spieler bekommt die nächste freie Taste. Löschst du einen Spieler, rücken die folgenden Tasten nach. Die Taste steht in der Spielerliste, in jeder Zeile und im Kasten links. Mehr als ${PKEYS.length} Spieler bedienst du mit der Maus.</p>
 <p><b>3. Bewertung</b> mit den Ziffern, von links nach rechts wie die Felder. Fehler ist immer die <kbd>1</kbd>:</p>
 ${['rec','att','srv'].map(c=>`<p><b>${CATS[c].n}:</b> ${CATS[c].b.map(([r,l],i)=>`<kbd>${i+1}</kbd> ${l}`).join(' · ')}</p>`).join('')}
 <p>Beispiel: <kbd>W</kbd> <kbd>I</kbd> <kbd>4</kbd> ist Angriff, Spieler mit der Taste I, Punkt. Beim Aufschlag brauchst du keinen Spieler: <kbd>E</kbd> <kbd>4</kbd> zählt ein Ass des aktuellen Aufschlägers.</p>
 <p>Weitere Tasten: <kbd>A</kbd> Punkt Gegner · <kbd>S</kbd> Gegnerfehler · <kbd>⌫</kbd> einen Schritt zurück (erst die Spielerauswahl, dann die letzte Eingabe) · <kbd>Strg</kbd>+<kbd>Z</kbd> Rückgängig · <kbd>D</kbd> Läufer weiterdrehen · <kbd>F</kbd> Spielstand korrigieren · <kbd>←</kbd> <kbd>→</kbd> Bereich wechseln · <kbd>Esc</kbd> Auswahl löschen · <kbd>?</kbd> diese Anleitung. Wechsel und alles Weitere gehen mit Maus oder Touchpad.</p></details>
 <details><summary>Zu zweit tracken</summary>
 <p>Mit der Google Tabelle können zwei Handys denselben Satz mitschreiben. Das zweite Handy öffnet den Reiter „Spiel", wählt das Spiel und tippt auf „Satz N fortsetzen". Neue Eingaben erscheinen auf dem anderen Handy bei der nächsten Eingabe, spätestens nach 30 Sekunden.</p>
 <p>Damit nichts doppelt gezählt wird und die Drehung nicht durcheinandergerät, teilt euch die Arbeit: Handy A zählt alles, was Punkte und Fehler entscheidet (Fehler, Punkt, Block, Ass, Punkt Gegner, Gegnerfehler). Handy B zählt nur die Bewertungen ohne Punkt: Annahme Schlecht, Gut und Perfekt, Angriff Ohne Wirkung und Wirkung, Aufschlag Ohne Wirkung und Wirkung.</p></details>
 <details><summary>Weitere Funktionen</summary>
 <p><b>⟳</b> schaltet zwischen Hoch- und Querformat um. <b>⚙</b> öffnet die Einstellungen: Google Tabelle, Daten als JSON sichern und zurückspielen, App sperren.</p>
 <p><b>Spiel oder Satz löschen:</b> In der Auswertung ganz unten im Kasten „Spiele und Sätze" steht neben jedem Spiel und jedem Satz ein Löschen-Knopf (zweimal tippen). Das löscht auch die Daten in der Google Tabelle und lässt sich nicht rückgängig machen. Taucht ein gelöschter Eintrag nach dem Abgleich wieder auf, ist das Google-Skript veraltet: Code.gs neu einfügen und mit „Neue Version" bereitstellen. Die App weist im Statusfeld darauf hin.</p>
 <p><b>Als App installieren:</b> Android: Chrome-Menü ⋮ → „App installieren". iPhone: Safari → Teilen → „Zum Home-Bildschirm". Auf dem iPhone hat die installierte App einen eigenen Speicher. Verbinde vorher die Google Tabelle oder sichere die Daten als JSON.</p>
 <p><b>Gesicherter Stand:</b> Fehlen bei einem Abgleich Daten in der Tabelle, die dein Handy hat, sichert die App den Stand des Handys. Unter ⚙ → „Gesicherter Stand" kannst du ihn wiederherstellen und hochladen.</p>
 <p>Ohne Google Tabelle liegen die Daten nur auf diesem Gerät. Sichere sie dann regelmäßig über „Als JSON kopieren". Mit Tabelle sehen alle Geräte denselben Stand.</p></details></div>`;
}

 const meta=e.ctrlKey||e.metaKey,k=e.key.length===1?e.key.toLowerCase():e.key;
 if(meta&&k!=='z')return;
 if(k==='?'){modal=modal==='help'?false:'help';render();e.preventDefault();return}
 if(k==='Escape'){if(modal){modal=false;render()}else if(KB.sel||fix||sub){KB.sel='';fix=false;sub=false;render()}return}
 const s=curSet();if(modal||tab!=='game'||!s)return;
 let ok=true;
 if(meta){undo(s);kbMsg('Rückgängig')}
 else if(has(CATKEYS,k))cat=CATKEYS[k];
 else if(PKEYS.indexOf(k)>=0){const p=S.players[PKEYS.indexOf(k)];if(!p)kbMsg('Taste '+k.toUpperCase()+' ist keinem Spieler zugeordnet');else if(!s.act.includes(p.id))kbMsg('#'+p.nr+' '+p.name+' steht nicht auf dem Feld');else{KB.sel=p.id;kbMsg('#'+p.nr+' '+p.name+' gewählt')}}
 else if(/^[1-9]$/.test(k)){
  const c0=cat,list=CATS[c0].b,i=+k-1;
  if(i>=list.length)kbMsg(CATS[c0].n+' hat nur die Bewertungen 1 bis '+list.length);
  else{
   let p=KB.sel?S.players.find(x=>x.id===KB.sel):null;
   if(!p&&c0==='srv')p=S.players.find(x=>x.id===padPos(s.pos)[0]);
   if(!p)kbMsg('Erst den Spieler wählen (seine Taste steht in der Zeile)');
   else{const r=list[i][0];addEv(s,{p:p.id,c:c0,r});kbMsg('✓ #'+p.nr+' '+p.name+' · '+lab(c0,r).join(' '));KB.sel=''}
  }
 }
 else if(k==='a'){addEv(s,{p:'',c:'sc',r:'opp'});kbMsg('Punkt Gegner')}
 else if(k==='s'){addEv(s,{p:'',c:'sc',r:'oerr'});kbMsg('Gegnerfehler')}
 else if(k==='d'){upd(s,{rot:nextRot(s.rot),pos:rotPos(s.pos||[])});kbMsg('Läufer '+s.rot)}
 else if(k==='f'){fix=!fix;sub=false}
 else if(k==='Backspace'){if(KB.sel){KB.sel='';kbMsg('Auswahl aufgehoben')}else{undo(s);kbMsg('Rückgängig')}}
 else if(k==='ArrowRight'||k==='ArrowLeft'){const o=['rec','att','srv'];cat=o[(o.indexOf(cat)+(k==='ArrowRight'?1:2))%3]}
 else ok=false;
 if(ok){e.preventDefault();render()}
});
let ROT=false;try{ROT=localStorage.getItem('vbrot')==='1'}catch(e){}
function view(){
 const port=innerHeight>innerWidth,rot=ROT&&port,c=document.documentElement;
 c.style.setProperty('--vw',innerWidth+'px');c.style.setProperty('--vh',innerHeight+'px');
 c.classList.toggle('rot',rot);c.classList.toggle('land',!port||rot);c.classList.toggle('lap',lapOn());
}
addEventListener('resize',view);addEventListener('orientationchange',()=>setTimeout(view,250));view();
function queueAll(){
 S.players.forEach(p=>S.pend.push({k:'p+',p:{id:p.id,name:p.name,nr:p.nr,role:p.role||''}}));
 S.games.forEach(g=>S.pend.push({k:'g+',g}));
 S.sets.forEach(s=>{S.pend.push({k:'s+',s:{id:s.id,gid:s.gid,opp:s.opp,date:s.date,serve:s.serve,rot:s.rot,act:s.act,pos:s.pos||[],rl:s.rl||{}}});s.ev.forEach(e=>S.pend.push(evOp(s,e)))});
 save();
}
function pushAll(){queueAll();sync()}
const BK='vbtracker-backup';
function idsOfState(st){const m=new Map();st.players.forEach(p=>m.set('p'+p.id,''));st.games.forEach(g=>m.set('g'+g.id,''));st.sets.forEach(s=>{m.set('s'+s.id,s.gid);s.ev.forEach(e=>m.set('e'+e.id,s.id))});return m}
function lostItems(old,cur,ops,dead){   // Daten, die dieses Gerät hatte, die nach dem Abgleich fehlen und nicht bewusst gelöscht wurden
 const o=idsOfState(old),n=idsOfState(cur),mk=k=>new Set(ops.filter(x=>x.k===k).map(x=>x.id));
 const dG=mk('g-'),dS=mk('s-'),dP=mk('p-'),dE=mk('e-');old.sets.forEach(s=>{if(dG.has(s.gid))dS.add(s.id)});
 let nn=0,struct=0,ev=0;
 o.forEach((par,key)=>{
  if(n.has(key))return;const ty=key[0],id=key.slice(1);
  if(dead.has(id)||(ty==='p'&&dP.has(id))||(ty==='g'&&dG.has(id))||(ty==='s'&&dS.has(id))||(ty==='e'&&(dE.has(id)||dS.has(par)||dead.has(par))))return;
  nn++;if(ty==='e')ev++;else struct++;
 });
 return{n:nn,struct,ev};
}
function backupSave(old,n){
 const st={players:old.players,games:old.games,sets:old.sets};
 try{const prev=JSON.parse(localStorage.getItem(BK)||'null');if(prev&&JSON.stringify(prev.state).length>=JSON.stringify(st).length)return;localStorage.setItem(BK,JSON.stringify({t:Date.now(),n,state:st}))}catch(e){}
}
function bkRead(){try{return JSON.parse(localStorage.getItem(BK)||'null')}catch(e){return null}}
function bkHtml(){
 const b=bkRead();if(!b||!b.state)return '';
 const c=cleanState(b.state);if(!c)return '';
 const d=new Date(b.t||0).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),ev=c.sets.reduce((a,s)=>a+s.ev.length,0);
 return `<div class="card"><h2>Gesicherter Stand</h2><div class="mu">Beim Abgleich am ${esc(d)} fehlten in der Tabelle ${esc(b.n)} Datensätze, die dieses Handy hatte. Gesichert sind ${c.players.length} Spieler, ${c.sets.length} Sätze und ${ev} Eingaben.</div>
 <button class="pri" data-act="restore" style="margin-top:8px">Wiederherstellen und hochladen</button>
 <div class="row" style="margin-top:8px"><button data-act="bkexp" style="flex:1">Als JSON kopieren</button><button data-act="bkdrop" style="flex:1">Verwerfen</button></div></div>`;
}
const NEEDVER=6;let lastWarn='',QUEUED=false;   // Mindestversion des Google-Skripts (Code.gs)
async function sync(){
 if(!CFG.url||busy||!UNL)return;
 if(!CFG.init&&!QUEUED&&(S.players.length||S.games.length||S.sets.length)){queueAll();QUEUED=true}   // erste Verbindung: lokale Daten zuerst hochladen, nie von einer leeren Tabelle überschreiben lassen
 busy=true;status='Synchronisiere...';ui();
 const ops=S.pend.slice();let ok=false;
 try{
  const r=await fetch(CFG.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({pw:CFG.pw,ops})});
  const d=await r.json();
  if(d.error)throw new Error(d.error);
  if(!(d.ver>=NEEDVER)){   // veraltetes Skript: Stand der Tabelle NICHT übernehmen, alle Eingaben bleiben gespeichert und gehen nach dem Update hoch
   const m='Das Google-Skript ist veraltet. Bitte Code.gs neu einfügen und neu bereitstellen. Deine Eingaben bleiben auf diesem Handy gespeichert.';
   if(m!==lastWarn)toast(m);lastWarn=m;throw new Error(m);
  }
  const delIds=ops.filter(o=>o.k==='g-'||o.k==='s-').map(o=>o.id);
  S.pend=S.pend.slice(ops.length);
  const by=new Map();(Array.isArray(d.events)?d.events:[]).forEach(e=>{if(!e||typeof e!=='object')return;const[c,r]=code(e.bereich,e.ergebnis);if(!by.has(e.sid))by.set(e.sid,[]);by.get(e.sid).push({id:e.id,p:e.p,c,r,rot:e.rot,t:e.t})});
  const nu=cleanState({players:d.players,games:d.games,sets:(Array.isArray(d.sets)?d.sets:[]).map(s=>({...s,ev:((s&&by.get(s.id))||[]).sort((x,y)=>(Number(x.t)||0)-(Number(y.t)||0))}))});
  if(!nu)throw new Error('Ungültige Antwort');
  let warn='';
  if(d.skipped>0)warn=d.skipped+' Eingaben hat das Google-Skript nicht angenommen.';
  if(delIds.some(id=>nu.games.some(g=>g.id===id)||nu.sets.some(x=>x.id===id)))warn='Löschen wurde vom Google-Skript nicht ausgeführt. Bitte Code.gs neu einfügen und mit neuer Version bereitstellen.';
  const old={players:S.players,games:S.games,sets:S.sets};
  S.players=nu.players;S.games=nu.games;S.sets=nu.sets;
  S.pend.forEach(applyOp);
  const lost=lostItems(old,S,ops,new Set(Array.isArray(d.dead)?d.dead.filter(x=>typeof x==='string'):[]));
  if(lost.n&&(lost.struct||lost.ev>=5)){backupSave(old,lost.n);toast('Achtung: '+lost.n+' Datensätze dieses Handys fehlten in der Tabelle. Der Stand ist gesichert (⚙ → Gesicherter Stand).')}
  if(S.cur&&!S.sets.some(s=>s.id===S.cur))S.cur=null;
  status=warn||'Synchronisiert '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  if(warn&&warn!==lastWarn)toast(warn);lastWarn=warn;
  ok=true;save();
  if(!CFG.init){CFG.init=true;try{localStorage.setItem(CK,JSON.stringify(CFG))}catch(x){}}
 }catch(e){status=/fetch|network/i.test(e.message)?'Keine Verbindung zur Tabelle. Web-App-URL und Zugriff Jeder prüfen':'Fehler: '+e.message}
 busy=false;ui();
 if(ok&&!modal&&(tab==='eval'||(tab==='game'&&curSet())))render();
 if(ok&&S.pend.length)setTimeout(sync,500);
}
const PS='vb-salt-943e92d1da31246c',PI=310000,PH='8568656516485d20ac7d2788d464c61bdd1e04d2947c253b77bec8f033015ba7';let UNL=false;
try{UNL=localStorage.getItem('vbpin')===PH}catch(e){}
async function kdf(pin){const en=new TextEncoder(),k=await crypto.subtle.importKey('raw',en.encode(pin),'PBKDF2',false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:en.encode(PS),iterations:PI},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const failRd=()=>{try{return JSON.parse(localStorage.getItem('vbfail')||'{}')}catch(e){return{}}};
function failAdd(){const f=failRd();f.n=(f.n||0)+1;if(f.n>=3)f.until=Date.now()+Math.min(3600,30*2**(f.n-3))*1000;try{localStorage.setItem('vbfail',JSON.stringify(f))}catch(e){}}
async function unlock(){
 const w=Math.ceil(((failRd().until||0)-Date.now())/1000);if(w>0){toast('Zu viele Versuche. Bitte '+w+' s warten');return}
 const v=document.getElementById('pin').value.trim().toLowerCase();
 let ok=false;try{ok=(await kdf(v))===PH}catch(e){toast('PIN-Prüfung nicht möglich (nur über https)');return}
 if(ok){UNL=true;try{localStorage.removeItem('vbfail');localStorage.setItem('vbpin',PH)}catch(e){}render();sync()}else{failAdd();toast('Falscher PIN');document.getElementById('pin').value=''}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pin')unlock()});
const tg=(a,v)=>{const i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)};
document.addEventListener('input',e=>{const k=e.target.dataset.in;if(k&&D)D[k]=e.target.value});
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('evd'))evOpen=e.target.open},true);
document.addEventListener('change',e=>{const k=e.target.dataset.sel;if(k==='fset'){fSet=e.target.value;render()}else if(k==='gid'&&D){D.gid=e.target.value;if(D.gid!=='new'){D.act=lastAct(D.gid);D.pos=fixPos(D.act,lastPos(D.gid));D.serve=nextServe(D.gid);D.rl=lastRl(D.gid)}render()}else if(k==='pos'&&D){const i=+e.target.dataset.i,v=e.target.value,j=v?D.pos.indexOf(v):-1;if(j>=0)D.pos[j]=D.pos[i];D.pos[i]=v;render()}else if(k==='lap'){LAPPREF=e.target.value||null;try{if(LAPPREF)localStorage.setItem('vblaptop',LAPPREF);else localStorage.removeItem('vblaptop')}catch(x){}view();render()}else if(k==='rl'&&D){D.rl[e.target.dataset.v]=e.target.value;render()}else if(k==='wrl'){const s=curSet();if(s){const rl={...(s.rl||{})};rl[e.target.dataset.v]=e.target.value;upd(s,{rl});render()}}else if(k==='prole'){op({k:'p~',id:e.target.dataset.v,role:e.target.value});render()}else if(k==='wpos'){const s=curSet();if(s){setPos(s,+e.target.dataset.i,e.target.value);render()}}});
document.addEventListener('click',e=>{
 if(e.target.id==='ov'){modal=false;render();return}
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,v=b.dataset.v,s=curSet();
 if(lapOn()&&document.activeElement&&document.activeElement.blur)document.activeElement.blur();
 if(a==='unlock'){unlock();return}
 if(a!=='end'&&a!=='delp'&&a!=='del')arm=null;
 if(a==='tab')tab=v;
 else if(a==='serve')D.serve=v;
 else if(a==='rot')D.rot=+v;
 else if(a==='tog'){tg(D.act,v);D.pos=fixPos(D.act,D.pos)}
 else if(a==='start'){const id=uid();let g=S.games.find(g=>g.id===D.gid);if(!g){g={id:uid(),opp:D.opp.trim().slice(0,40)||'Gegner',date:cday(D.date)};op({k:'g+',g})}op({k:'s+',s:{id,gid:g.id,opp:g.opp,date:g.date,serve:D.serve,rot:D.rot,act:D.act.slice(),pos:fixPos(D.act,D.pos),rl:{...D.rl}}});S.cur=id;cat=D.serve==='Aufschlag'?'srv':'rec';D=null;save()}
 else if(a==='cat')cat=v;
 else if(a==='wech'){sub=!sub;fix=false}
 else if(a==='fix'){fix=!fix;sub=false}
 else if(a==='del'){const key='del:'+v;if(arm!==key){arm=key;setTimeout(()=>{if(arm===key){arm=null;render()}},4000)}else{arm=null;op({k:v[0]==='g'?'g-':'s-',id:v.slice(2)});fSet='all'}}
 else if(a==='tga'){const na=s.act.slice();tg(na,v);upd(s,{act:na})}
 else if(a==='rot+'){upd(s,{rot:nextRot(s.rot),pos:rotPos(s.pos||[])})}
 else if(a==='hit'){const[p,c,r]=v.split('|');addEv(s,{p,c,r});navigator.vibrate&&navigator.vibrate(15)}
 else if(a==='undo')undo(s);
 else if(a==='pt'){addEv(s,{p:'',c:'sc',r:v});navigator.vibrate&&navigator.vibrate(15)}
 else if(a==='end'){if(arm!=='end'){arm='end';setTimeout(()=>{if(arm==='end'){arm=null;render()}},3000)}else{arm=null;S.cur=null;sub=false;save()}}
 else if(a==='addp'){const n=pname.value.trim().slice(0,40),r=pnr.value.trim().slice(0,3);if(!n||!r){toast('Name und Nummer eingeben');return}op({k:'p+',p:{id:uid(),name:n,nr:r,role:cR(prole0.value)}})}
 else if(a==='delp'){if(arm!==v){arm=v;setTimeout(()=>{if(arm===v){arm=null;render()}},3000)}else{arm=null;op({k:'p-',id:v})}}
 else if(a==='resume'){S.cur=v;D=null;catInit=true;const rs=S.sets.find(x=>x.id===v);if(rs)cat=replay(rs).srv==='us'?'srv':'rec';save()}
 else if(a==='cfg'){const u=cfgurl.value.trim();if(u&&!URLRE.test(u)){toast('Ungültige URL: erwartet https://script.google.com/.../exec');return}QUEUED=false;CFG={url:u,pw:cfgpw.value.trim().slice(0,100)};try{localStorage.setItem(CK,JSON.stringify(CFG))}catch(x){}sync()}
 else if(a==='syncnow')sync();
 else if(a==='pushall'){if(!CFG.url){toast('Erst URL speichern');return}pushAll()}
 else if(a==='orient'){ROT=!ROT;try{localStorage.setItem('vbrot',ROT?'1':'0')}catch(x){}view();toast(ROT?'Querformat: Handy quer halten':'Hochformat')}
 else if(a==='restore'){const b=bkRead(),c=b&&cleanState(b.state);if(!c){toast('Kein gültiger Stand gesichert');return}S.players=c.players;S.games=c.games;S.sets=c.sets;S.cur=null;S.pend=[];CFG.init=false;QUEUED=true;try{localStorage.setItem(CK,JSON.stringify(CFG));localStorage.removeItem(BK)}catch(x){}mig();save();queueAll();toast('Wiederhergestellt, wird hochgeladen');sync()}
 else if(a==='bkdrop'){try{localStorage.removeItem(BK)}catch(x){}}
 else if(a==='bkexp'){const b=bkRead();if(!b)return;const tx=JSON.stringify(b.state);(navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject()).then(()=>toast('Kopiert'),()=>{imp.value=tx;imp.select();toast('Text markiert, bitte kopieren')});return}
 else if(a==='shareimg'){shareImage();return}
 else if(a==='install'&&DEFERRED){DEFERRED.prompt();DEFERRED=null}
 else if(a==='help')modal='help';
 else if(a==='gear')modal='set';
 else if(a==='gearx')modal=false;
 else if(a==='lock'){UNL=false;modal=false;try{localStorage.removeItem('vbpin')}catch(x){}}
 else if(a==='exp'){const t=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Kopiert'),()=>{imp.value=t;imp.select();toast('Text markiert, bitte kopieren')});return}
 else if(a==='imp'){try{if(imp.value.length>3e6)throw 0;const c=cleanState(JSON.parse(imp.value));if(!c||(!c.sets.length&&!c.players.length))throw 0;S=c;mig();save();toast('Importiert')}catch(x){toast('Ungültige Daten');return}}
 render();
});
render();
if(CFG.url)sync();
setInterval(()=>{if(!document.hidden)sync()},30000);
